[project]
name = "ai-lawyer"
version = "0.1.0"
description = "An AI-powered legal assistant specialised in Egyptian law, built from multiple agents, tools, skills, and backend services (RAG, OCR, ASR, LLMs)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "python-multipart",
    "sqlalchemy",
    "alembic",
    "bcrypt",
    "python-jose[cryptography]",
    "email-validator",
    "langchain-google-genai",
    "langchain-core",
    "langgraph",
    "google-genai",
    "qdrant-client",
    "fastembed",
    "cohere",
    "Pillow",
    "pymupdf",
    "python-docx",
    "beautifulsoup4",
    "requests",
    "httpx",
    "python-dotenv",
    "slowapi",
    "psutil",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    # Only needed by scripts/tei_parity_check.py, which compares TEI's
    # embeddings against a locally-loaded model. Kept out of the runtime
    # dependencies because torch alone is ~2GB.
    "torch",
    "sentence-transformers",
]
