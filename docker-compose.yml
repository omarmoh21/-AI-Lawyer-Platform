services:
  # Serves the Arabic dense embedding model over HTTP so the backend doesn't
  # have to load it in-process. The backend calls this for every legal search
  # and chat query, so it must be running before those endpoints work.
  tei-embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: tei-embedder
    ports:
      - "8080:80"
    volumes:
      # Mounts your Hugging Face cache so the model isn't re-downloaded on every
      # start. Defaults to the standard per-user cache location; override with
      # HF_CACHE_DIR in a .env file next to this compose file if yours differs.
      - "${HF_CACHE_DIR:-~/.cache/huggingface}:/data"
    command:
      - "--model-id"
      - "Omartificial-Intelligence-Space/Arabic-Triplet-Matryoshka-V2"
    restart: unless-stopped
